name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux GUI libraries
        # Qt 6's xcb platform plugin needs these (libxcb-cursor0 in particular);
        # without them it aborts while creating the QApplication. Mesa provides
        # software OpenGL inside Xvfb, which napari's canvas needs.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils libegl1 libgl1 libopengl0 libgl1-mesa-dri \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xinput0 libfontconfig1 libdbus-1-3
      - name: Install TIKI
        run: python -m pip install -e '.[test]'
      - name: Run tests
        env:
          XDG_CACHE_HOME: /tmp/tiki-cache
          XDG_CONFIG_HOME: /tmp/tiki-config
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" python -m pytest -q

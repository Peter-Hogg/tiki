name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1 libgl1-mesa-dri libxkbcommon-x11-0
      - name: Install TIKI
        run: python -m pip install -e '.[test]'
      - name: Run tests
        env:
          XDG_CACHE_HOME: /tmp/tiki-cache
          XDG_CONFIG_HOME: /tmp/tiki-config
        run: xvfb-run -a python -m pytest -q
